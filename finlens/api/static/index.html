<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FinLens — SEC filing Q&A</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
      :root {
        --bg: #fbfbfa;
        --panel: #fff;
        --ink: #1a1a18;
        --muted: #6b6b66;
        --line: #e4e4df;
        --accent: #1f5c4a;
        --warn: #a05a1f;
        --bad: #a02020;
        --good: #1f7a4a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16171a; --panel: #1e2024; --ink: #e8e8e4; --muted: #9a9a94;
          --line: #303338; --accent: #6fc4a4; --good: #6fc4a4;
          --warn: #d9a05a; --bad: #e07070;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--ink);
        font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap { max-width: 820px; margin: 0 auto; }
      header { margin-bottom: 1.5rem; }
      h1 { font-size: 1.4rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
      .sub { color: var(--muted); font-size: .9rem; }
      .card {
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 10px; padding: 1rem; margin-bottom: 1rem;
      }
      label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .35rem; }
      textarea, select, input {
        width: 100%; padding: .6rem .7rem; border: 1px solid var(--line);
        border-radius: 7px; background: var(--bg); color: var(--ink);
        font: inherit; resize: vertical;
      }
      .row { display: flex; gap: .75rem; flex-wrap: wrap; align-items: flex-end; }
      .row > * { flex: 1 1 160px; }
      button {
        background: var(--accent); color: #fff; border: 0; border-radius: 7px;
        padding: .6rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
        flex: 0 0 auto;
      }
      button:hover { filter: brightness(1.08); }
      .examples { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .6rem; }
      .examples button {
        background: transparent; color: var(--muted); border: 1px solid var(--line);
        font-size: .78rem; font-weight: 400; padding: .3rem .6rem;
      }
      .answer { font-size: 1.02rem; white-space: pre-wrap; }
      .badge {
        display: inline-block; font-size: .7rem; text-transform: uppercase;
        letter-spacing: .04em; padding: .15rem .5rem; border-radius: 20px;
        border: 1px solid var(--line); color: var(--muted); margin-right: .4rem;
      }
      .verified { color: var(--good); border-color: var(--good); }
      .unverified { color: var(--bad); border-color: var(--bad); }
      details { margin-top: .75rem; border-top: 1px solid var(--line); padding-top: .6rem; }
      summary { cursor: pointer; font-size: .85rem; color: var(--muted); }
      pre {
        background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
        padding: .7rem; overflow-x: auto; font-size: .78rem; margin: .5rem 0 0;
      }
      .warn { color: var(--warn); font-size: .85rem; margin-top: .5rem; }
      ol.cites { font-size: .85rem; color: var(--muted); padding-left: 1.2rem; margin: .4rem 0 0; }
      table { border-collapse: collapse; width: 100%; font-size: .8rem; }
      th, td { text-align: left; padding: .3rem .5rem; border-bottom: 1px solid var(--line); }
      .meta { color: var(--muted); font-size: .78rem; margin-top: .75rem; }
      .htmx-request .spinner { display: inline; }
      .spinner { display: none; color: var(--muted); font-size: .85rem; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>FinLens</h1>
        <div class="sub">
          Question answering over SEC EDGAR filings. Every figure is
          reconciled against its source before it is shown.
        </div>
      </header>

      <form class="card" hx-post="/ui/ask" hx-target="#result" hx-swap="innerHTML"
            hx-indicator="#spin">
        <label for="question">Question</label>
        <textarea id="question" name="question" rows="2"
                  placeholder="What was Apple's gross margin in fiscal 2023?"></textarea>

        <div class="row" style="margin-top:.75rem">
          <div>
            <label for="user">Sign in as</label>
            <select id="user" name="user">
              <option value="admin">Coverage lead — all companies</option>
              <option value="analyst">Tech analyst — AAPL, MSFT only</option>
            </select>
          </div>
          <div style="flex:0 0 auto">
            <button type="submit">Ask</button>
            <span class="spinner" id="spin">thinking…</span>
          </div>
        </div>

        <div class="examples">
          <button type="button" onclick="fill(this)">What was Apple's revenue in fiscal 2023?</button>
          <button type="button" onclick="fill(this)">Which company had the highest R&amp;D intensity in 2023?</button>
          <button type="button" onclick="fill(this)">What supply chain risks does Apple disclose?</button>
          <button type="button" onclick="fill(this)">Why did Apple report a net loss in 2023?</button>
        </div>
        <div class="sub" style="margin-top:.6rem">
          Try the last one as each user — it has a false premise, and the two
          accounts see different companies.
        </div>
      </form>

      <div id="result"></div>
    </div>

    <script>
      function fill(el) {
        document.getElementById("question").value = el.textContent.trim();
      }
    </script>
  </body>
</html>

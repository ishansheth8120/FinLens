[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finlens"
version = "0.1.0"
description = "Question answering over SEC EDGAR filings: XBRL warehouse + filing-text RAG behind a routed agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Core runtime shared by every subsystem. Anything heavier (Spark, dbt, Airflow)
# lives in an extra so the API image does not have to carry it.
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "structlog>=24.1",
  "typer>=0.12",
]

[project.optional-dependencies]
# Cloudflare R2 is S3-compatible, so this is plain boto3.
storage = [
  "boto3>=1.34",
]
spark = [
  "pyspark>=3.5,<4.0",
  "beautifulsoup4>=4.12",
]
warehouse = [
  "dbt-core>=1.8",
  "dbt-duckdb>=1.8",
  "dbt-bigquery>=1.8",
]
embed = [
  "numpy>=1.26",
  "duckdb>=1.0",
  # Local CPU embeddings: free forever, no API dependency.
  "sentence-transformers>=3.0",
]
# Supabase Postgres + pgvector.
pgvector = [
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
]
agent = [
  "duckdb>=1.0",
  "numpy>=1.26",
  # AST-based SQL validation. Not optional in practice - the guard needs it.
  "sqlglot>=25.0",
]
# Free-tier LLM providers, in fallback order.
llm = [
  "google-genai>=1.0",
  "groq>=0.11",
]
api = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pyjwt>=2.8",
  # Form posts from the HTMX UI.
  "python-multipart>=0.0.9",
]
airflow = [
  "apache-airflow>=2.9,<3.0",
]
eval = [
  "pandas>=2.2",
  "tabulate>=0.9",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  # Pydantic needs this to resolve `X | None` annotations below 3.10.
  "eval-type-backport>=0.2 ; python_version < '3.10'",
]
# Everything the app needs, minus the JVM and scheduler stacks. Default install.
all = [
  "finlens[storage,embed,pgvector,agent,llm,api,eval,dev]",
]

[project.scripts]
finlens-ingest = "finlens.ingest.cli:app"
finlens-embed = "finlens.embed.cli:app"
finlens-eval = "finlens.eval.cli:app"
finlens-ask = "finlens.agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["finlens"]
# dbt models, DAGs, Dockerfiles and the report are repo assets, not library code.
exclude = [
  "finlens/warehouse",
  "finlens/airflow",
  "finlens/docker",
  "finlens/docs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root on the path, so the suite runs against the working tree without an
# install step. Keeps `pytest` working in a checkout that has not been pip-installed.
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "integration: hits a real external service or requires the JVM; excluded from the default run",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"finlens/airflow/dags/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
